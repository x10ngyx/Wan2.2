<text x="68" y="146" class="box-title">latent_pool</text>
<text x="68" y="172" class="shape">[B,128]</text>
<rect x="292" y="118" rx="8" ry="8" width="246" height="56" class="feature" stroke-width="2"/>
<text x="308" y="146" class="box-title">feature encoder 1</text>
<text x="308" y="172" class="shape">128 -&gt; 64</text>
<text x="308" y="194" class="detail">Linear, SiLU, Dropout</text>
<path d="M248 146 H292" class="arrow thin"/>
<path d="M538 146 H612" class="arrow thin"/>
<rect x="52" y="194" rx="8" ry="8" width="196" height="56" class="input" stroke-width="2"/>
