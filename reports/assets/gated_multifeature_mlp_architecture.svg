<text x="308" y="248" class="shape">128 -&gt; 64</text>
<text x="308" y="270" class="detail">Linear, SiLU, Dropout</text>
<path d="M248 222 H292" class="arrow thin"/>
<path d="M538 222 H612" class="arrow thin"/>
<rect x="52" y="270" rx="8" ry="8" width="196" height="56" class="input" stroke-width="2"/>
<text x="68" y="298" class="box-title">temporal_var</text>
<text x="68" y="324" class="shape">[B,128]</text>
<rect x="292" y="270" rx="8" ry="8" width="246" height="56" class="feature" stroke-width="2"/>
<text x="308" y="298" class="box-title">feature encoder 3</text>
<text x="308" y="324" class="shape">128 -&gt; 64</text>
<text x="308" y="346" class="detail">Linear, SiLU, Dropout</text>
<path d="M248 298 H292" class="arrow thin"/>
<path d="M538 298 H612" class="arrow thin"/>
<rect x="52" y="346" rx="8" ry="8" width="196" height="56" class="input" stroke-width="2"/>
<text x="68" y="374" class="box-title">frame_diff_mean</text>
<text x="68" y="400" class="shape">[B,128]</text>
<rect x="292" y="346" rx="8" ry="8" width="246" height="56" class="feature" stroke-width="2"/>
<text x="308" y="374" class="box-title">feature encoder 4</text>
<text x="308" y="400" class="shape">128 -&gt; 64</text>
<text x="308" y="422" class="detail">Linear, SiLU, Dropout</text>
<path d="M248 374 H292" class="arrow thin"/>
<path d="M538 374 H612" class="arrow thin"/>
<rect x="52" y="422" rx="8" ry="8" width="196" height="56" class="input" stroke-width="2"/>
<text x="68" y="450" class="box-title">frame_diff_var</text>
<text x="68" y="476" class="shape">[B,128]</text>
<rect x="292" y="422" rx="8" ry="8" width="246" height="56" class="feature" stroke-width="2"/>
<text x="308" y="450" class="box-title">feature encoder 5</text>
<text x="308" y="476" class="shape">128 -&gt; 64</text>
<text x="308" y="498" class="detail">Linear, SiLU, Dropout</text>
<path d="M248 450 H292" class="arrow thin"/>
<path d="M538 450 H612" class="arrow thin"/>
<rect x="612" y="118" rx="8" ry="8" width="260" height="360" class="feature" stroke-width="2"/>
<text x="628" y="146" class="box-title">encoded features</text>
<text x="628" y="172" class="shape">z1..z5, each [B,64]</text>
<text x="628" y="194" class="detail">stack -&gt; [B,5,64]</text>
<rect x="52" y="560" rx="8" ry="8" width="248" height="86" class="input" stroke-width="2"/>
<text x="68" y="588" class="box-title">conditioning inputs</text>
<text x="68" y="614" class="shape">step_fraction, target_psnr</text>
<text x="68" y="636" class="detail">[B,2]</text>
<rect x="364" y="560" rx="8" ry="8" width="240" height="86" class="cond" stroke-width="2"/>
<text x="380" y="588" class="box-title">condition MLP</text>
<text x="380" y="614" class="shape">[B,2] -&gt; [B,64]</text>
<text x="380" y="636" class="detail">condition embedding c</text>
<path d="M300 603 H364" class="arrow"/>
<rect x="668" y="560" rx="8" ry="8" width="232" height="86" class="cond" stroke-width="2"/>
<text x="684" y="588" class="box-title">gate head + softmax</text>
<text x="684" y="614" class="shape">c -&gt; [B,5]</text>
<text x="684" y="636" class="detail">g1..g5, sum=1</text>
<path d="M604 603 H668" class="arrow"/>
<rect x="950" y="238" rx="8" ry="8" width="278" height="116" class="fusion" stroke-width="2"/>
<text x="966" y="266" class="box-title">gated feature fusion</text>
<text x="966" y="292" class="shape">sum_i g_i * z_i</text>
<text x="966" y="314" class="detail">[B,64] fused feature</text>
<text x="966" y="336" class="detail">gate controls feature weights</text>
<path d="M872 296 H950" class="arrow"/>
<path d="M784 560 C830 492 980 428 1089 354" class="control"/>
<rect x="1276" y="238" rx="8" ry="8" width="300" height="116" class="fusion" stroke-width="2"/>
<text x="1292" y="266" class="box-title">concat with condition</text>
<text x="1292" y="292" class="shape">fused feature [B,64]</text>
<text x="1292" y="314" class="detail">+ c [B,64] -&gt; [B,128]</text>
<path d="M1228 296 H1276" class="arrow"/>
<path d="M604 603 C940 603 940 336 1276 336" class="arrow thin dash"/>
<rect x="1276" y="460" rx="8" ry="8" width="300" height="102" class="fusion" stroke-width="2"/>
<text x="1292" y="488" class="box-title">prediction head</text>
<text x="1292" y="514" class="shape">128 -&gt; 64 -&gt; 64 -&gt; 1</text>
<text x="1292" y="536" class="detail">LN, SiLU, Dropout, scaled Sigmoid</text>
<path d="M1426 354 V460" class="arrow"/>
<rect x="1276" y="632" rx="8" ry="8" width="300" height="78" class="output" stroke-width="2"/>
<text x="1292" y="660" class="box-title">predicted threshold</text>
<text x="1292" y="686" class="shape">[B,1]</text>
<text x="1292" y="708" class="detail">range: [0.10,0.80]</text>
<path d="M1426 562 V632" class="arrow"/>
